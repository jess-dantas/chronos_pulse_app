name: Build e Deploy Flutter Web no Vercel

on:
  push:
    branches:
      - main       # Dispara o deploy de Produção após o merge na main
  pull_request:
    branches:
      - main       # Valida o build ao abrir PR para main
      - staging    # Valida o build ao abrir PR para staging
      - develop    # Valida o build ao abrir PR para develop

jobs:
  # JOB 1: Valida se o projeto compila sem erros em qualquer PR
  validate-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"
      - run: flutter pub get
      - name: Test Build
        run: |
          flutter config --no-analytics
          flutter config --enable-web
          flutter build web --release

  # JOB 2: Executa o Deploy de Produção APENAS no push da main (pós-merge)
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production  # Ativa os Environment Secrets e a aprovação manual
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"

      - name: Cache Flutter layers
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - run: flutter pub get

      - name: Build Web
        run: |
          flutter config --no-analytics
          flutter config --enable-web
          flutter build web --release --dart-define=API_URL=${{ secrets.RENDER_BACKEND_URL }}

      - name: Deploy no Vercel (Produção)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          vercel build --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN