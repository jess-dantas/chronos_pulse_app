name: Deploy Produção Vercel

on:
  push:
    branches: [main] # Executa APENAS após o PR ser aceito e o merge ocorrer na main
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production  # Ativa os Environment Secrets e a Aprovação Manual do GitHub
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Cache Flutter layers
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - run: flutter pub get

      - name: Build Web Release com backend do Render
        run: |
          flutter config --no-analytics
          flutter config --enable-web
          flutter build web --release --dart-define=API_URL=${{ secrets.RENDER_BACKEND_URL }}

      - name: Deploy no Vercel (Produção)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          vercel build --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: flutter-web-production-build
          path: build/web