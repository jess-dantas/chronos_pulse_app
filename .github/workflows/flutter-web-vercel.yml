name: Build e Deploy Flutter Web no Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production  # ← NECESSÁRIO: Carrega os Environment Secrets e ativa a aprovação manual
    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout do código
      - uses: actions/checkout@v4

      # 2. Instalar Flutter SDK
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"

      - name: Cache Flutter layers
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - run: flutter pub get

      # 3. Build Web Release com API URL dos Environment Secrets
      - name: Build Web
        run: |
          flutter config --no-analytics
          flutter config --enable-web
          flutter build web --release --dart-define=API_URL=${{ secrets.RENDER_BACKEND_URL }}

      # 4. Deploy direto dos arquivos estáticos compilados para a Vercel
      - name: Deploy no Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          vercel build --prod --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      # 5. Upload dos artefatos (opcional para download posterior no GitHub)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web