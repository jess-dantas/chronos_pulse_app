name: Deploy Production Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - name: Build Web Release com backend do Render
        run: |
          flutter config --no-analytics
          flutter config --enable-web
          flutter build web --release --dart-define=API_URL=${{ secrets.RENDER_BACKEND_URL }}

      - name: Deploy no Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@59.25.4
          mkdir -p .vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
          mkdir -p .vercel/output/static
          cp -r build/web/. .vercel/output/static/
          printf '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-production-build
          path: build/web