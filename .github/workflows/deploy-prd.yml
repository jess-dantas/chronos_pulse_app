name: Deploy Production Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - name: Build Web Release com backend do Render
        run: |
          flutter config --no-analytics
          flutter config --enable-web
          flutter build web --release --dart-define=API_URL=${{ secrets.RENDER_BACKEND_URL }}

      - name: Deploy no Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@59.25.4
          mkdir -p .vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
          mkdir -p .vercel/output/static
          cp -r build/web/. .vercel/output/static/
          printf '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-production-build
          path: build/web

  # Artefatos Android de produção (assinados com o keystore da release).
  # Os APKs saem apontando para o backend do Render (secrets.RENDER_BACKEND_URL).
  # Baixe-os na página da execução do workflow (aba Artifacts).
  build-android-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - name: Decodifica keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/chronos-pulse-release.keystore

      - name: Grava key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/app/key.properties <<EOF
          storeFile=chronos-pulse-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APKs (cliente + admin)
        run: |
          flutter build apk --release --flavor cliente \
            --dart-define=API_URL=${{ secrets.RENDER_BACKEND_URL }} \
            --dart-define=APP_MODE=cliente
          flutter build apk --release --flavor admin \
            --dart-define=API_URL=${{ secrets.RENDER_BACKEND_URL }} \
            --dart-define=APP_MODE=admin

      # APKs versionados: <flavor>-release-<versão>-g<sha7>.apk (ex.: 1.0.0+1 → 1.0.0_1)
      - name: Versiona APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '_')
          SHA=${GITHUB_SHA::7}
          cd build/app/outputs/flutter-apk
          mv app-cliente-release.apk "app-cliente-release-${VERSION}-g${SHA}.apk"
          mv app-admin-release.apk "app-admin-release-${VERSION}-g${SHA}.apk"

      - name: Upload APKs de produção
        uses: actions/upload-artifact@v4
        with:
          name: chronos-pulse-android-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-cliente-release-*.apk
            build/app/outputs/flutter-apk/app-admin-release-*.apk
          if-no-files-found: error

      # Mesmos APKs do artefato, espelhados na pasta do Google Drive.
      - name: Envia APKs para o Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: 1GMbMgphU35o34-dMfoZrTE0p7k1dAgFg
        run: |
          bash .github/scripts/gdrive-upload.sh \
            build/app/outputs/flutter-apk/app-cliente-release-*.apk \
            build/app/outputs/flutter-apk/app-admin-release-*.apk