name: CI Frontend Flutter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-mobile:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get

      - name: Build APK (flavor cliente, API de produção)
        run: >-
          flutter build apk --release --flavor cliente
          --dart-define=API_URL=${{ secrets.RENDER_BACKEND_URL || 'https://chronos-pulse.onrender.com/api/v1' }}
          --dart-define=APP_MODE=cliente

      # APK versionado: app-cliente-release-<versão>-g<sha7>.apk (ex.: 1.0.0+1 → 1.0.0_1)
      - name: Versiona APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '_')
          SHA=${GITHUB_SHA::7}
          cd build/app/outputs/flutter-apk
          mv app-cliente-release.apk "app-cliente-release-${VERSION}-g${SHA}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-cliente
          path: build/app/outputs/flutter-apk/app-cliente-release-*.apk
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get

      - name: Build Web
        run: |
          flutter config --no-analytics
          flutter config --enable-web
          flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web

  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get

      # Compila sem assinatura para validar o projeto iOS (Podfile, Info.plist,
      # permissões de câmera/foto) a cada PR.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

  security-push:
    if: github.event_name == 'push'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1

  security-pr:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.1